name: Release

# Builds the macOS .dmg and Windows .msi/.exe installers. Each OS's
# bundle has to be produced on that OS, so this uses a matrix rather
# than cross-compiling. Runs on a pushed version tag, or manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # A build whose version isn't newer than what's installed is never
      # offered as an update - and nothing about that failure is visible.
      # Catch a forgotten bump here instead.
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag v$tag does not match src-tauri/Cargo.toml version $crate."
            echo "Run ./scripts/set-version.sh $tag, commit, then retag."
            exit 1
          fi
          echo "Version $crate matches tag $GITHUB_REF_NAME."

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # Signing updater artifacts needs the private key. Rather than failing
      # the whole release when it isn't set up yet, the committed config ships
      # with signing off and this turns it on only when there is a key to sign
      # with - so a first release works before the keypair exists.
      - name: Enable updater artifacts when a signing key is configured
        id: updater
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            printf '{"bundle":{"createUpdaterArtifacts":true}}' > updater.conf.json
            # tauri-action resolves --config from the repo root, not from
            # src-tauri, so the file has to live here.
            echo "args=--config updater.conf.json" >> "$GITHUB_OUTPUT"
            echo "Signing key present - updater artifacts will be built and signed."
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret. Building installers without updater artifacts, so installed copies will not auto-update. See the README's Automatic updates section."
          fi

      - name: Build and bundle (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts and the latest.json manifest the
          # installed app polls. Without these two secrets the build still
          # succeeds, but it produces no update manifest - see the README's
          # "Automatic updates" section for generating the keypair.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key is password-protected. A passwordless (-W) key is not
          # a working alternative here: macOS accepted one and Windows
          # failed with "Wrong password for that key", with and without
          # this variable set to an empty string.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Job Tracker ${{ github.ref_name }}"
          # This text also becomes the `notes` field in latest.json, which is
          # what an installed copy shows when it offers the update.
          releaseBody: |
            Installed copies pick this up automatically.

            The build is not code-signed, so Windows SmartScreen and macOS
            Gatekeeper warn on a fresh install - see the README.
          # Published straight away. Leaving it as a draft meant the tag and
          # the built installers could drift apart - it is easy to "publish"
          # from the tag page, which creates a second, empty release instead
          # of releasing the one CI just built.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}
