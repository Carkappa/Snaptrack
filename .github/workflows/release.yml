name: Release

# Builds the macOS .dmg and Windows .msi/.exe installers. Each OS's
# bundle has to be produced on that OS, so this uses a matrix rather
# than cross-compiling. Runs on a pushed version tag, or manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Build and bundle (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Job Tracker ${{ github.ref_name }}"
          releaseBody: |
            Unsigned build - see the README for the Gatekeeper / SmartScreen
            warnings you'll need to click through on first launch.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
