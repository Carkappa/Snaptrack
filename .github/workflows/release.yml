name: Release

# Builds the macOS .dmg and Windows .msi/.exe installers. Each OS's
# bundle has to be produced on that OS, so this uses a matrix rather
# than cross-compiling. Runs on a pushed version tag, or manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # A build whose version isn't newer than what's installed is never
      # offered as an update - and nothing about that failure is visible.
      # Catch a forgotten bump here instead.
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag v$tag does not match src-tauri/Cargo.toml version $crate."
            echo "Run ./scripts/set-version.sh $tag, commit, then retag."
            exit 1
          fi
          echo "Version $crate matches tag $GITHUB_REF_NAME."

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Build and bundle (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts and the latest.json manifest the
          # installed app polls. Without these two secrets the build still
          # succeeds, but it produces no update manifest - see the README's
          # "Automatic updates" section for generating the keypair.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Job Tracker ${{ github.ref_name }}"
          releaseBody: |
            Unsigned build - see the README for the Gatekeeper / SmartScreen
            warnings you'll need to click through on first launch.

            Installed copies pick this up automatically once the release is
            published (a draft release is not served to the updater).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
