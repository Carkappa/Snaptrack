name: Test

# Compiles the Rust backend and runs its unit + integration tests on every
# push and pull request. The release workflow only runs on a version tag, so
# without this a break could sit unnoticed until release day.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch: {}

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # Tauri needs GTK/WebKit headers to build on Linux. The app itself
      # only ships for macOS and Windows; this job is purely a compile and
      # test gate, so the cheapest runner is the right one.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf

      # Deliberately not --verbose: it prints a full rustc invocation per
      # crate, which buries the actual compile error under thousands of
      # lines when something does break.
      # --locked fails rather than silently rewriting Cargo.lock, so the
      # committed lock cannot drift out of date again without CI saying so.
      # tests/latex_build.rs compiles a real document with a real engine
      # and skips when there is none, so without this the whole compile
      # path is covered only by unit tests of its string handling - the
      # part least likely to be wrong. -no-install-recommends keeps this to
      # the base formats rather than pulling all of TeX Live.
      - name: Install a minimal TeX
        run: |
          sudo apt-get install -y --no-install-recommends             texlive-latex-base texlive-latex-recommended

      # EXPECT_LATEX turns tests/latex_build.rs's skip into a failure, so
      # removing the install above cannot quietly remove the coverage too.
      - name: cargo test
        working-directory: src-tauri
        env:
          EXPECT_LATEX: "1"
        run: cargo test --locked

      # Cargo resolves and rewrites the lockfile here whether or not the
      # committed one was current. Publishing it means a machine without a
      # Rust toolchain can still commit an accurate lock.
      - name: Upload the resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock

  # The Linux job above cannot compile the macOS-only OCR engine, and the
  # release workflow only runs on a tag - so without this a break in
  # system_ocr/macos_engine.rs would first show up on release day, with
  # the tag already pushed. A check rather than a build: this is here to
  # catch code that does not compile, and the release job does the rest.
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  # The frontend has no build step and no npm dependencies, and this keeps it
  # that way: a static server plus the Chrome already on the runner. The test
  # page writes its own verdict into #summary, so `--dump-dom` after the page
  # has run is enough to read the result out.
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # A command the frontend calls but nobody registered fails only in
      # the built app - Rust compiles, and the harness mocks invoke by name.
      - name: Check every invoked command is registered
        run: bash scripts/check-commands.sh

      # A backslash-n that became a real newline: fatal in JS, silent
      # in Rust, so it compiles and ships.
      - name: Check no string literal is broken across lines
        run: bash scripts/check-syntax.sh

      # The harness mocks by name and shape; a renamed Rust field would
      # otherwise keep passing here and fail in the built app.
      - name: Check harness mocks match the Rust types
        run: bash scripts/check-mock-shapes.sh

      - name: Run the frontend tests in headless Chrome
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/ >/dev/null && break
            sleep 0.5
          done

          chrome_args="--headless=new --disable-gpu --no-sandbox --virtual-time-budget=10000"

          failed=0
          # flows drives the real app.js through the mocked harness, so it
          # is the only one of these that can catch the frontend calling a
          # command that does not exist, or a form quietly dropping a field.
          for page in calendar stats format flows; do
            google-chrome $chrome_args --dump-dom "http://127.0.0.1:8000/tests/$page.test.html" > "$page.html"
            if grep -qE 'All [0-9]+ tests passed' "$page.html"; then
              echo "$page: $(grep -oE 'All [0-9]+ tests passed' "$page.html")"
            else
              echo "::error::Frontend $page tests failed"
              grep -oE '<div id="summary"[^>]*>[^<]*' "$page.html" || true
              grep -oE '<li class="fail">.*?</li>' "$page.html" || true
              failed=1
            fi
          done
          exit $failed
