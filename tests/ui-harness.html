<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- These are dev pages edited constantly; a cached copy reads as a bug
       in the code you just changed. -->
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Tracker UI harness</title>
  <link id="app-styles" rel="stylesheet" href="../src/styles.css" />
  <style>
    /* The harness runs the real UI inside a window-sized frame so the
       layout is the same one the Tauri webview gets. */
    /* styles.css locks the page to a full-height, non-scrolling window;
       inside the harness the app lives in a fixed-size box instead. */
    html, body { height: auto; overflow: auto; margin: 0; }
    #app-frame .app { height: 100%; }
    #harness-bar {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 12px; padding: 6px 10px; background: #111; color: #eee;
      display: flex; gap: 10px; align-items: center;
    }
    #harness-bar b { color: #6ee7b7; }
    #harness-status { color: #fbbf24; }
    #app-frame {
      width: 420px; height: 640px; border: 1px solid #444; margin: 10px;
      overflow: hidden; position: relative; resize: both;
    }
  </style>
</head>
<body>
  <div id="harness-bar">
    <b>UI harness</b>
    <span>Real index.html + app.js, with the Tauri bridge mocked.</span>
    <span id="harness-status">loading&hellip;</span>
  </div>
  <div id="app-frame"></div>

  <script>
    // ---- Mock Tauri bridge -------------------------------------------------
    //
    // app.js talks to the Rust side only through `invoke`, so standing in a
    // fake one lets the whole frontend run in a plain browser. The fixture
    // rows below are shaped exactly like what `list_applications` returns.

    const FIXTURES = [
      { date_applied: "2026-09-01", company: "Amazon", position: "Robotics SDE Intern", location: "Westboro, WI", work_type: "On-site", employment_type: "Internship", salary_range: null, status: "Applied", last_updated: "2026-09-01", job_id: "4123456789", url: "https://example.com/1", notes: null },
      { date_applied: "2026-09-01", company: "Stripe", position: "Backend Engineer", location: "Remote", work_type: "Remote", employment_type: "Full-time", salary_range: "$150k - $190k", status: "Interviewing", last_updated: "2026-09-01", job_id: null, url: null, notes: null },
      { date_applied: "2026-09-01", company: "Figma", position: "Product Engineer", location: "San Francisco, CA", work_type: "Hybrid", employment_type: "Full-time", salary_range: null, status: "Applied", last_updated: "2026-09-01", job_id: null, url: null, notes: null },
      { date_applied: "2026-09-01", company: "Linear", position: "Frontend Engineer", location: "Remote", work_type: "Remote", employment_type: "Full-time", salary_range: null, status: "Rejected", last_updated: "2026-09-01", job_id: null, url: null, notes: null },
      { date_applied: "2026-09-02", company: "Vercel", position: "DX Engineer", location: "Remote", work_type: "Remote", employment_type: "Full-time", salary_range: null, status: "Applied", last_updated: "2026-09-02", job_id: null, url: null, notes: null },
      { date_applied: "2026-09-02", company: "Notion", position: "Platform Engineer", location: "New York, NY", work_type: "Hybrid", employment_type: "Full-time", salary_range: null, status: "Ghosted", last_updated: "2026-09-02", job_id: null, url: null, notes: null },
      { date_applied: "2026-09-08", company: "Anthropic", position: "Product Engineer", location: "Seattle, WA", work_type: "Hybrid", employment_type: "Full-time", salary_range: null, status: "Applied", last_updated: "2026-09-08", job_id: null, url: null, notes: null },
      { date_applied: "2026-09-15", company: "Ramp", position: "Software Engineer", location: "New York, NY", work_type: "On-site", employment_type: "Full-time", salary_range: null, status: "Offered", last_updated: "2026-09-15", job_id: null, url: null, notes: null },
      { date_applied: "2026-08-27", company: "Datadog", position: "Site Reliability Engineer", location: "Boston, MA", work_type: "Hybrid", employment_type: "Full-time", salary_range: null, status: "Applied", last_updated: "2026-08-27", job_id: null, url: null, notes: null },
      { date_applied: "", company: "Mystery Corp", position: "Unknown Role", location: null, work_type: null, employment_type: null, salary_range: null, status: "Applied", last_updated: "", job_id: null, url: null, notes: "Row with an unreadable date" },
    ];

    const state = {
      rows: FIXTURES.map((r) => ({ ...r })),
      calls: [],
      updateCheckEnabled: true,
      autoInstallUpdates: false, // the harness defaults this off so the fixture UI is clickable
      listeners: {},
      // Point this at an { outcome: "Available", ... } object to exercise the
      // update banner: window.__harness.updateResponse = { ... }
      updateResponse: { outcome: "UpToDate" },
      installUpdateCalls: 0,
      installUpdateFails: false,
      openedUrls: [],
      // Set true to exercise the rejection path the Rust scheme check produces.
      openUrlFails: false,
      apiKeys: {},
      extractionMethod: "tesseract",
      hotkey: "Ctrl+Shift+J",
      // Shortcuts the mocked backend refuses, to exercise the fallback.
      hotkeyRefuses: ["Ctrl+Alt+Delete"],
      seenWelcome: true,
      models: {},
      // "date|company|position" keys that have an archived capture.
      screenshots: ["2026-09-01|Amazon|Robotics SDE Intern"],
      openedScreenshots: [],
      statusDefs: [
        { name: "Applied", kind: "waiting" },
        { name: "Interviewing", kind: "replied" },
        { name: "Offered", kind: "replied" },
        { name: "Rejected", kind: "replied" },
        { name: "Ghosted", kind: "waiting" },
        { name: "Withdrawn", kind: "closed" },
      ],
      // What a mocked "Import a workbook..." would find.
      // Set imagePath to null to exercise "the user cancelled the picker".
      imagePath: "C:\\Users\\you\\Pictures\\posting.png",
      clipboardImage:
        "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==",
      importPath: "C:\Users\you\Documents\Other.xlsx",
      importRows: [
        { date_applied: "2026-08-20", company: "Datadog", position: "SRE", location: null, work_type: null, employment_type: null, salary_range: null, status: "Applied", last_updated: "2026-08-20", job_id: null, url: null, notes: null },
        { date_applied: "2026-09-01", company: "Amazon", position: "Robotics SDE Intern", location: null, work_type: null, employment_type: null, salary_range: null, status: "Applied", last_updated: "2026-09-01", job_id: null, url: null, notes: null },
        { date_applied: "", company: "", position: "", location: null, work_type: null, employment_type: null, salary_range: null, status: "", last_updated: "", job_id: null, url: null, notes: null },
      ],
    };

    const HANDLERS = {
      get_statuses: () => state.statusDefs.map((d) => d.name),
      get_status_defs: () => state.statusDefs.map((d) => ({ ...d })),
      set_status_defs: ({ defs }) => {
        // Mirrors sanitize_status_defs in models.rs.
        const seen = new Set();
        const cleaned = [];
        for (const def of defs) {
          const name = String(def.name || "").trim();
          if (!name) continue;
          if (name.length > 40) throw new Error(`'${name}' is too long for a status (40 characters max).`);
          if (seen.has(name.toLowerCase())) continue;
          seen.add(name.toLowerCase());
          cleaned.push({ name, kind: def.kind });
        }
        if (!cleaned.length) throw new Error("Keep at least one status.");
        state.statusDefs = cleaned;
        return cleaned.map((d) => ({ ...d }));
      },
      insert_application_at_index: ({ index, application }) => {
        state.rows.splice(Math.min(index, state.rows.length), 0, { ...application });
        return null;
      },
      pick_import_file: () => state.importPath,
      import_applications: ({ path }) => {
        if (!path) throw new Error("'' no longer exists.");
        const existing = new Set(
          state.rows.map((r) => r.company.trim().toLowerCase() + "\u0000" + r.position.trim().toLowerCase())
        );
        const summary = { imported: 0, skipped_duplicates: 0, skipped_blank: 0 };
        for (const row of state.importRows) {
          if (!row.company.trim() && !row.position.trim()) { summary.skipped_blank += 1; continue; }
          const key = row.company.trim().toLowerCase() + "\u0000" + row.position.trim().toLowerCase();
          if (existing.has(key)) { summary.skipped_duplicates += 1; continue; }
          existing.add(key);
          state.rows.push({ ...row });
          summary.imported += 1;
        }
        return summary;
      },
      get_extraction_providers: () => [
        { id: "tesseract", label: "Tesseract - free, offline, no key", needs_key: false, key_label: "", key_placeholder: "", key_help: "", default_model: "" },
        { id: "claude", label: "Claude (Anthropic)", needs_key: true, key_label: "Anthropic API key", key_placeholder: "sk-ant-...", key_help: "Create one at console.anthropic.com under API Keys.", default_model: "claude-sonnet-5" },
        { id: "openai", label: "ChatGPT (OpenAI)", needs_key: true, key_label: "OpenAI API key", key_placeholder: "sk-...", key_help: "Create one at platform.openai.com/api-keys.", default_model: "gpt-4o" },
        { id: "gemini", label: "Gemini (Google)", needs_key: true, key_label: "Google AI Studio API key", key_placeholder: "AIza...", key_help: "Create one at aistudio.google.com/apikey.", default_model: "gemini-2.0-flash" },
      ],
      get_model: ({ provider }) => {
        const d = { claude: "claude-sonnet-5", openai: "gpt-4o", gemini: "gemini-2.0-flash" };
        return state.models[provider] || d[provider] || "";
      },
      set_model: ({ provider, model }) => {
        const d = { claude: "claude-sonnet-5", openai: "gpt-4o", gemini: "gemini-2.0-flash" };
        if (!model.trim()) delete state.models[provider];
        else state.models[provider] = model.trim();
        return state.models[provider] || d[provider] || "";
      },
      screenshot_for_application: ({ company, position, dateApplied }) => {
        const key = [dateApplied, company, position].join("|");
        return state.screenshots.includes(key) ? "C:\shots\\" + key + ".png" : null;
      },
      open_screenshot: ({ company, position, dateApplied }) => {
        const key = [dateApplied, company, position].join("|");
        if (!state.screenshots.includes(key)) {
          throw new Error("No screenshot was archived for this application.");
        }
        state.openedScreenshots.push(key);
        return null;
      },
      has_api_key: ({ provider }) => Boolean(state.apiKeys[provider]),
      save_api_key: ({ provider, key }) => {
        state.apiKeys[provider] = key;
        return null;
      },
      delete_api_key: ({ provider }) => {
        delete state.apiKeys[provider];
        return null;
      },
      get_extraction_method: () => state.extractionMethod,
      set_extraction_method: ({ method }) => {
        state.extractionMethod = method;
        return null;
      },
      get_hotkey: () => state.hotkey,
      set_hotkey: ({ shortcut }) => {
        if (state.hotkeyRefuses.includes(shortcut)) {
          throw new Error(`Couldn't use ${shortcut}: already registered.`);
        }
        state.hotkey = shortcut;
        return shortcut;
      },
      get_seen_welcome: () => state.seenWelcome,
      set_seen_welcome: () => {
        state.seenWelcome = true;
        return null;
      },
      local_ocr_available: () => false,
      get_excel_path: () => "C:\\Users\\you\\Documents\\JobApplications.xlsx",
      list_applications: () => state.rows.map((r) => ({ ...r })),
      export_csv: () => "C:\\Users\\you\\Documents\\JobApplications.csv",
      save_application: ({ application }) => {
        state.rows.push({ ...application });
        return { outcome: "Saved" };
      },
      update_status_at_index: ({ index, status }) => {
        state.rows[index].status = status;
        return null;
      },
      update_application_at_index: ({ index, application }) => {
        state.rows[index] = { ...application };
        return null;
      },
      delete_application_at_index: ({ index, expectedCompany, expectedPosition }) => {
        const row = state.rows[index];
        if (!row) throw new Error("That row no longer exists - reload the list and try again.");
        // Mirrors the Rust guard: the row has to still be the one the user saw.
        if (
          row.company.trim().toLowerCase() !== expectedCompany.trim().toLowerCase() ||
          row.position.trim().toLowerCase() !== expectedPosition.trim().toLowerCase()
        ) {
          throw new Error(
            "That row is now '" + row.company + " - " + row.position + "', not the one you asked to delete."
          );
        }
        state.rows.splice(index, 1);
        return null;
      },
      extract_with_local_ocr: () => ({
        kind: "Parsed",
        fields: {
          company: null, // the failure the click-to-fill list exists for
          position: "| a Amazon",
          location: "Westboro, WI",
          work_type: null, employment_type: null, salary_range: null,
          job_id: null, posted_date: null, url: null, notes: null,
        },
        blocks: [
          "| a Amazon",
          "Robotics - Software Development Engineer Fall Intern/Co-op - 2026",
          "Westboro, WI - 5 days ago - 42 people clicked apply",
          "On-site Full-time",
        ],
        site: "linkedin",
      }),
      learn_ocr_hints: () => null,
      // A 1x1 PNG is enough to drive the capture path; the mocked
      // extractor ignores the bytes anyway.
      read_clipboard_image: () => state.clipboardImage,
      pick_image_file: () => state.imagePath,
      read_image_file: () => ({ base64: state.clipboardImage, media_type: "image/png" }),
      pick_excel_path: () => null,
      save_screenshot: () => "screenshot.png",
      open_url: ({ url }) => {
        if (state.openUrlFails) {
          throw new Error("Refusing to open a 'javascript' link - only http and https are allowed.");
        }
        state.openedUrls.push(url);
        return null;
      },
      get_app_version: () => "0.1.0",
      get_update_check_enabled: () => state.updateCheckEnabled,
      get_auto_install_updates: () => state.autoInstallUpdates,
      set_auto_install_updates: ({ enabled }) => {
        state.autoInstallUpdates = enabled;
        return null;
      },
      set_update_check_enabled: ({ enabled }) => {
        state.updateCheckEnabled = enabled;
        return null;
      },
      check_for_update: ({ force }) => {
        if (!force && !state.updateCheckEnabled) {
          return { outcome: "Skipped", reason: "Automatic update checks are turned off." };
        }
        return state.updateResponse;
      },
      install_update: () => {
        state.installUpdateCalls += 1;
        if (state.installUpdateFails) throw new Error("Couldn't install the update: network error");
        return null;
      },
    };

    window.__TAURI__ = {
      core: {
        invoke: async (cmd, args) => {
          state.calls.push({ cmd, args });
          const handler = HANDLERS[cmd];
          if (!handler) throw new Error("harness: no mock for command '" + cmd + "'");
          return handler(args || {});
        },
      },
      event: {
        listen: async (name, handler) => {
          (state.listeners[name] || (state.listeners[name] = [])).push(handler);
          return () => {
            state.listeners[name] = (state.listeners[name] || []).filter((h) => h !== handler);
          };
        },
      },
      window: { getCurrentWindow: () => ({ hide: () => { state.calls.push({ cmd: "window.hide" }); } }) },
    };
    // Stands in for the Rust side emitting an event, so the download-progress
    // and installing states can be driven from a test:
    //   window.__harness.emit("update-download-progress", { downloaded: 5, total: 10 })
    state.emit = (name, payload) => {
      for (const handler of state.listeners[name] || []) handler({ event: name, payload });
    };
    window.__harness = state;

    // ---- Load the real UI --------------------------------------------------

    // Every load is cache-busted. Without it a browser will happily keep
    // serving the previous app.js or styles.css after an edit, which reads
    // as a bug in the code you just changed.
    const fresh = (url) => url + (url.includes("?") ? "&" : "?") + "t=" + Date.now();

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = fresh(src);
        s.onload = resolve;
        s.onerror = () => reject(new Error("failed to load " + src));
        document.body.appendChild(s);
      });
    }

    (async () => {
      const status = document.getElementById("harness-status");
      try {
        const styles = document.getElementById("app-styles");
        styles.href = fresh(styles.getAttribute("href").split("?")[0]);
        const html = await fetch(fresh("../src/index.html")).then((r) => r.text());
        const doc = new DOMParser().parseFromString(html, "text/html");
        doc.querySelectorAll("script").forEach((s) => s.remove());
        document.getElementById("app-frame").innerHTML = doc.body.innerHTML;

        await loadScript("../src/format.js");
        await loadScript("../src/stats.js");
        await loadScript("../src/calendar.js");
        await loadScript("../src/app.js");
        status.textContent = "ready";
        status.style.color = "#6ee7b7";
      } catch (e) {
        status.textContent = "harness failed: " + e.message;
        status.style.color = "#fca5a5";
      }
    })();
  </script>
</body>
</html>
