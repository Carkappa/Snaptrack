[package]
name = "job-tracker"
version = "0.14.0"
description = "A native job-application tracker with tray icon and global hotkey capture"
authors = ["Justin Du"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "job_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_xlsxwriter = "0.79"
calamine = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["fs"] }
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
base64 = "0.22"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
csv = "1"
regex = "1"
url = "2"
printpdf = { version = "0.11.1", default-features = false }
# Same version printpdf already pulls in, so the tree carries one copy.
lopdf = { version = "0.44", default-features = false }
# A .docx is a zip of XML; this is already used by the tests.
zip = "2"

# Windows ships an OCR engine. It needs no install, produces no debris
# from logos, and reads chips Tesseract misses - see DEVELOPING.md for the
# measurements.
# macOS has shipped the Vision framework since 10.15, and it is the reason
# a Mac no longer needs a Tesseract install either. Default features cover
# the four headers system_ocr/macos_engine.rs uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Media_Ocr",
  "Globalization",
  "Graphics_Imaging",
  "Storage",
  "Storage_Streams",
  "Foundation_Collections",
] }

[dev-dependencies]
tauri = { version = "2", features = ["tray-icon", "test"] }
zip = "2"
# The async commands need a runtime to be called directly from a test.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
